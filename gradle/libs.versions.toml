wearCompose = "1.4.1"
activityCompose = "1.10.1"
coreKtx = "1.16.0"
browser = "1.8.0"
lifecycle = "2.9.0"
coroutines = "1.10.2"
serialization = "1.8.1"
okhttp = "4.12.0"
datastore = "1.1.7"
work = "2.10.1"
playServicesWearable = "19.0.0"
