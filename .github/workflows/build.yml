name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain :shared:test 2>&1 | tee test.log
      - name: Build debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain :mobile:assembleDebug :wear:assembleDebug 2>&1 | tee build.log
      - name: Screenshots
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain :mobile:recordPaparazziDebug :wear:recordPaparazziDebug 2>&1 | tee screenshots.log
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -hE "e: |What went wrong|Exception|Caused by|FAILED|rror" -A3 *.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          for x in $(find . -path '*test-results*' -name '*.xml'); do
            grep -A4 "<failure" "$x" | head -12 | while IFS= read -r l; do echo "::error::$l"; done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            mobile/src/test/snapshots/images/*.png
            wear/src/test/snapshots/images/*.png
      - name: Publish screenshots to the screenshots branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          out=$(mktemp -d)
          mkdir -p "$out/phone" "$out/watch"
          for p in mobile/src/test/snapshots/images/*.png; do cp "$p" "$out/phone/$(basename "$p" | sed -E 's/.*_([A-Za-z]+)\.png$/\1.png/')"; done
          for p in wear/src/test/snapshots/images/*.png; do cp "$p" "$out/watch/$(basename "$p" | sed -E 's/.*_([A-Za-z]+)\.png$/\1.png/')"; done
          cd "$out"
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
