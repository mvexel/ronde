name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :shared:test
      - name: Build debug APKs
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug
      - name: Screenshots
        run: ./gradlew :mobile:recordPaparazziDebug :wear:recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            mobile/src/test/snapshots/images/*.png
            wear/src/test/snapshots/images/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
